[package]
name = "depot_actor"
version = "0.1.0"
edition = "2021"

[dependencies]
alpaca_api_client = "0.8.0"

tracing = "0.1"
tracing-subscriber = "0.3"

config = "0.15"

# Use "mysql" feature for MariaDB compatibility
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "macros"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }

# gRPC dependencies
tonic = "0.14.3"
prost = "0.14.3"

[build-dependencies]
tonic-build = "0.14.3"
